name: release-builds
on:
    release:
      types: ['published','created','edited']  

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4 
      with:
        fetch-depth: 1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pytest
        pip install -e .
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --exit-zero --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest -v --checkversioning

  wheel-build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        # Only used to run the build frontend; the result is a pure-python
        # py3-none-any distribution, so this is independent of the package's
        # own requires-python. Kept current so that hatchling is not pinned
        # back to the last release supporting an EOL interpreter.
        python-version: ["3.12"]
    needs: unit-tests

    steps:
    - name: Checkout git
      uses: actions/checkout@v4 
      with:
        fetch-depth: 1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build sdist and wheel
      run: |
        python3 -m pip install --upgrade pip
        pip install build
        python3 -m build
        ls -l dist/
        ls -l .
    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheel_${{ github.sha }}
        path: dist/pymzqc-*any.whl
        retention-days: 14
    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist_${{ github.sha }}
        path: dist/
        retention-days: 14

  container-build:
    runs-on: ubuntu-latest
    needs: wheel-build

    steps:
      - name: Get dockerfile
        uses: actions/checkout@v4 
        with:
          fetch-depth: 1
      - name: Get wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel_${{ github.sha }}
      - name: Set tags
        run: echo mwalzerpymzqc:${GITHUB_REF##*/}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
#      - name: Login to DockerHub
#        uses: docker/login-action@v1 
#        with:
#          username: ${{ secrets.DOCKERHUB_USERNAME }}
#          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to quay.io
        uses: docker/login-action@v1 
        with:
          registry: quay.io
          username: ${{ secrets.quay_user_mzqc_action }}
          password: ${{ secrets.quay_pw_mzqc_action }}
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            quay.io/mwalzer/pymzqc:latest
            quay.io/mwalzer/pymzqc:${{ github.event.release.tag_name }}

  validator-container-build:
    runs-on: ubuntu-latest
    needs: wheel-build

    steps:
      - name: Get dockerfile
        uses: actions/checkout@v4 
        with:
          fetch-depth: 1
      - name: Get wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel_${{ github.sha }}
      - name: Set tags
        run: echo mwalzerpymzqc:${GITHUB_REF##*/}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
#      - name: Login to DockerHub
#        uses: docker/login-action@v1 
#        with:
#          username: ${{ secrets.DOCKERHUB_USERNAME }}
#          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to quay.io
        uses: docker/login-action@v1 
        with:
          registry: quay.io
          username: ${{ secrets.quay_user_mzqc_action }}
          password: ${{ secrets.quay_pw_mzqc_action }}
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: mzqcaccessories/onlinevalidator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            quay.io/mwalzer/mzqc-validator:latest
            quay.io/mwalzer/mzqc-validator:${{ github.event.release.tag_name }}

  publish-pypi:
    # This workflow also fires on 'created' and 'edited'. Uploading a file that
    # is already on PyPI is an error, so only publish once, on publication.
    if: github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: wheel-build
    environment:
      name: pypi
      url: https://pypi.org/p/pymzqc
    permissions:
      # Required for trusted publishing: mints the short-lived OIDC token that
      # PyPI exchanges for an upload token. No API token secret is involved.
      id-token: write

    steps:
      - name: Get distributions
        uses: actions/download-artifact@v4
        with:
          name: dist_${{ github.sha }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

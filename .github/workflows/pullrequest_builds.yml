name: pullrequest-builds
on:
    pull_request:
      types: ['opened', 'edited', 'reopened', 'synchronize']

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        # oldest and newest supported Python (requires-python in pyproject.toml)
        python-version: ["3.10", "3.14"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pytest
        pip install -e .
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --exit-zero --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest -v

  viewer-tests:
    # Browser tests of the static mzQC viewer (tests/test_viewer.py) in headless
    # Chromium. Non-blocking: a failure (install or tests) is reported as a
    # warning annotation on the run but never fails the workflow.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Viewer tests (non-blocking)
      run: |
        set +e
        python -m pip install --upgrade pip &&
          pip install -e . pytest playwright &&
          python -m playwright install --with-deps --only-shell chromium &&
          pytest -v tests/test_viewer.py
        status=$?
        if [ "$status" -ne 0 ]; then
          echo "::warning title=Viewer tests failed::The mzQC viewer browser tests failed (exit code $status). This does not fail the workflow; see the 'Viewer tests (non-blocking)' step log."
        fi
        exit 0

  wheel-build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        # See the note in release_builds.yml: build frontend only, the wheel is
        # pure-python. Mirrors the release build so PRs exercise the same path.
        python-version: ["3.12"]
    needs: unit-tests

    steps:
    - name: Checkout git
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build wheel
      run: |
        python3 -m pip install --upgrade pip
        pip install build
        python3 -m build --wheel
        ls -l dist/
        ls -l .
    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheel_${{ github.sha }}
        path: dist/pymzqc-*any.whl
        retention-days: 14

  container-build:
    runs-on: ubuntu-latest
    needs: wheel-build
    env:
      # Dependabot and fork pull requests deliberately run without access to
      # repository secrets, so they cannot authenticate against quay.io and the
      # login step fails with "Username and password required". Build the image
      # regardless, so the Dockerfile still gets validated, and skip only the
      # login and the push.
      CAN_PUSH: ${{ secrets.quay_user_mzqc_action != '' }}

    steps:
      - name: Get dockerfile
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel_${{ github.sha }}
      - name: Set image tag
        run: |
          # Branch names may contain '/' (all Dependabot branches do), which is
          # not a legal character in a Docker tag. Map anything outside the
          # allowed tag charset to '-'.
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          printf 'SAFE_REF=%s\n' "$(printf '%s' "$ref" | tr -c 'a-zA-Z0-9_.-' '-')" >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
#      - name: Login to DockerHub
#        uses: docker/login-action@v3
#        with:
#          username: ${{ secrets.DOCKERHUB_USERNAME }}
#          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          load: true
          tags: pymzqc-smoke-test
      - name: Smoke test
        run: bash .github/scripts/smoke-test-container.sh pymzqc pymzqc-smoke-test
      - name: Login to quay.io
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.quay_user_mzqc_action }}
          password: ${{ secrets.quay_pw_mzqc_action }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: |
            quay.io/mwalzer/pymzqc:latest_pullrequest_build
            quay.io/mwalzer/pymzqc:${{ env.SAFE_REF }}_${{ github.sha }}

  validator-container-build:
    runs-on: ubuntu-latest
    needs: wheel-build
    env:
      # see container-build
      CAN_PUSH: ${{ secrets.quay_user_mzqc_action != '' }}

    steps:
      - name: Get dockerfile
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel_${{ github.sha }}
      - name: Set image tag
        run: |
          # Branch names may contain '/' (all Dependabot branches do), which is
          # not a legal character in a Docker tag. Map anything outside the
          # allowed tag charset to '-'.
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          printf 'SAFE_REF=%s\n' "$(printf '%s' "$ref" | tr -c 'a-zA-Z0-9_.-' '-')" >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
#      - name: Login to DockerHub
#        uses: docker/login-action@v3
#        with:
#          username: ${{ secrets.DOCKERHUB_USERNAME }}
#          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mzqcaccessories/onlinevalidator/Dockerfile
          platforms: linux/amd64
          load: true
          tags: validator-smoke-test
      - name: Smoke test
        run: bash .github/scripts/smoke-test-container.sh validator validator-smoke-test
      - name: Login to quay.io
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.quay_user_mzqc_action }}
          password: ${{ secrets.quay_pw_mzqc_action }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mzqcaccessories/onlinevalidator/Dockerfile
          platforms: linux/amd64
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: |
            quay.io/mwalzer/mzqc-validator:latest_pullrequest_build
            quay.io/mwalzer/mzqc-validator:${{ env.SAFE_REF }}_${{ github.sha }}

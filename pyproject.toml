[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pymzqc"
dynamic = ["version"]
description = "Python library for the PSI-mzQC quality control file format."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mathias Walzer", email = "walzer@ebi.ac.uk" },
]
dependencies = [
    "jsonschema>=3.2.0",
    # Note: in order to validate JSON date-time type expressions the rfc3339 libs need to be present (otherwise the Formatchecker for date-time won't be initialised)
    "strict-rfc3339",
    "rfc3339-validator",
    "numpy",
    "pandas>=1.1.5",
    "pronto",
    "requests>=2.27.1",
    "click",
]

[project.urls]
Homepage = "https://github.com/MS-Quality-hub/pymzqc"

# Optional feature sets ("extras"). The base install covers the mzqc library,
# the offline validator CLI (mzqc-validator) and the file-handling CLIs. Extras
# only add dependencies; see README.md for what each one enables.
[project.optional-dependencies]
# Flask app for the online validator API.
onlinevalidator = [
    "Flask>=2.0",
    "Flask-Cors>=5.0.0",
    "Flask-RESTful>=0.3.9",
    "Werkzeug>=2.2,<3.0",
    "gunicorn>=20.0; platform_system != 'Windows'",
]
dev = [
    "pymzqc[onlinevalidator]",
    # tests
    "pytest",
    "flake8",
    "playwright",
    # build
    "build",
    # documentation
    "sphinx>=5.0",
    "myst-parser",
    "nbsphinx",
]

# Console scripts are always installed with the wheel (Python packaging cannot
# tie an entry point to an extra). A script whose extra dependencies are
# missing exits with a message naming the extra to install.
[project.scripts]
mzqc-validator = "mzqcaccessories.offlinevalidator.mzqc_offline_validator:start"
mzqc-fileinfo = "mzqcaccessories.filehandling.mzqc_fileinfo:mzqcfileinfo"
mzqc-filemerger = "mzqcaccessories.filehandling.mzqc_filemerger:mzqcfilemerger"
mzqc-fixdescriptions = "mzqcaccessories.filehandling.mzqc_fixdescriptions:mzqcfixdescriptions"
# pymzqc[onlinevalidator]
mzqc-onlinevalidator = "mzqcaccessories.onlinevalidator.mzqc_online_validator:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["mzqc", "mzqcaccessories"]
# hatchling includes every file under a package directory, so leave out the
# deployment, development and documentation files that live next to the code.
# Hidden folders, jupyter/, doc/ and tests/ are outside the packages and never
# reach the wheel.
exclude = [
    "**/README.md",
    "**/__pycache__",
    "mzqcaccessories/onlinevalidator/Dockerfile",
    "mzqcaccessories/onlinevalidator/compose.yaml",
    "mzqcaccessories/onlinevalidator/dev-test-validation.py",
    "mzqcaccessories/onlinevalidator/local_validator.html",
    "mzqcaccessories/viewer/tests",
]

[tool.hatch.build.targets.sdist]
# Leading slashes anchor to the project root; without them these patterns are
# gitignore-style and would match e.g. containers/README.md too.
include = [
    "/mzqc",
    "/mzqcaccessories",
    "/tests",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "**/__pycache__",
]
